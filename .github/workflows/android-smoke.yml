name: Android smoke test

# Instaluje APK z wybranego uruchomienia „Android APK” na emulatorze, uruchamia aplikację
# i zapisuje logcat oraz zrzut ekranu. Wykrywa awarie przy starcie, zanim APK trafi na telefon.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID uruchomienia workflow „Android APK” (puste = najnowsze udane)'
        required: false
  workflow_run:
    workflows: ['Android APK']
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Włącz KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pobierz APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.event.inputs.run_id || github.event.workflow_run.id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "Android APK" --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "Run: $RUN_ID"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -D apk
          find apk -name '*.apk' -exec cp {} app.apk \;
          ls -la app.apk
      - name: Emulator, instalacja, uruchomienie
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p pl.prostozroli.app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > screen.png || true
            adb logcat -d > logcat.txt || true
            adb shell pidof pl.prostozroli.app > pid.txt || echo "BRAK PROCESU" > pid.txt
      - name: Wynik
        if: always()
        run: |
          echo "== PID: $(cat pid.txt 2>/dev/null)"
          echo "== Awarie:"
          grep -nE "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|ExceptionsManager|Error:|SIGSEGV|libc.*Fatal" logcat.txt | head -80 || true
          if grep -q "BRAK PROCESU" pid.txt || grep -q "FATAL EXCEPTION" logcat.txt; then echo "Aplikacja nie działa po starcie"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ github.run_id }}
          path: |
            logcat.txt
            screen.png
